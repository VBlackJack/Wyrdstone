[package]
name = "wyrdstone_game"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "wyrdstone_game"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "wyrdstone"
path = "src/main.rs"

[dependencies]
wyrdstone_core = { path = "../wyrdstone_core" }
rand.workspace = true
# Pin Bevy 0.15.2: 0.15.3 gates about_to_wait redraws on Windows (#17488/#18065), freezing resizes.
bevy = { version = "=0.15.2", default-features = false, features = [
    "bevy_winit",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_asset",
    "bevy_state",
    "bevy_audio",
    "wav",
    "png",
] }
bevy_winit = { version = "=0.15.3", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "=0.15.2", default-features = false, features = ["multi_threaded"] }

[target.'cfg(all(not(target_os = "android"), not(target_arch = "wasm32")))'.dependencies]
directories = "5.0"
winit = "0.30"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "=0.15.2", default-features = false, features = ["webgl2"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
bevy = { version = "=0.15.2", default-features = false, features = ["android-native-activity"] }

[package.metadata.android]
package = "com.julienbombled.wyrdstone"
label = "Wyrdstone"
build_targets = ["aarch64-linux-android"]
resources = "../../android/res"

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "Wyrdstone"
icon = "@mipmap/ic_launcher"

[package.metadata.android.application.activity]
exported = true
orientation = "fullUser"
launch_mode = "singleTask"
config_changes = "orientation|screenSize|screenLayout|smallestScreenSize|keyboard|keyboardHidden|navigation|uiMode|density|fontScale|locale|layoutDirection"

[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

[[package.metadata.android.uses_feature]]
opengles_version = [3, 0]
required = true
