[workspace]
resolver = "2"
members = [
    "crates/wyrdstone_core",
    "crates/wyrdstone_game",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Julien Bombled"]
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ron = "0.8"
rand = "0.8"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = false
