name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows release binary
        run: cargo build --release --bin wyrdstone
      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: wyrdstone-windows-x64
          path: target/release/wyrdstone.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35, build-tools, and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --locked
      - name: Build Android ARM64 APK
        run: cargo apk build --release -p wyrdstone_game --lib
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wyrdstone-android-arm64
          path: target/release/apk/*.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/wyrdstone-windows-x64/wyrdstone.exe
            artifacts/wyrdstone-android-arm64/*.apk
