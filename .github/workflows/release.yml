name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.97.1"
  ANDROID_NDK_VERSION: 27.2.12479018
  CARGO_APK_VERSION: 0.10.0

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify tag matches Cargo workspace version
        shell: bash
        run: |
          pkg_ver="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          tag_ver="${GITHUB_REF_NAME#v}"
          if [ "$pkg_ver" != "$tag_ver" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml workspace version ${pkg_ver}"
            exit 1
          fi
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

  build-windows:
    needs: [verify]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build Windows release binary
        run: cargo build --release --locked --bin wyrdstone
      - name: Rename Windows binary
        shell: bash
        run: cp target/release/wyrdstone.exe "wyrdstone-${{ github.ref_name }}-windows-x64.exe"
      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wyrdstone-windows-x64
          path: wyrdstone-${{ github.ref_name }}-windows-x64.exe

  build-android:
    needs: [verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install Android SDK 35, build-tools, and NDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "ndk;${ANDROID_NDK_VERSION}"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Install cargo-apk
        run: cargo install cargo-apk --version "${CARGO_APK_VERSION}" --locked
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is empty or missing"
            exit 1
          fi
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_PASSWORD is empty or missing"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "CARGO_APK_RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Build Android ARM64 APK
        run: cargo apk build --release -p wyrdstone_game --lib
      - name: Rename Android APK
        run: |
          apk_path="target/release/apk/wyrdstone_game.apk"
          if [ ! -f "$apk_path" ]; then
            echo "::error::Expected signed APK at $apk_path"
            ls -la target/release/apk/ || true
            exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk_path"
          cp "$apk_path" "wyrdstone-${{ github.ref_name }}-android-arm64.apk"
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wyrdstone-android-arm64
          path: wyrdstone-${{ github.ref_name }}-android-arm64.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Generate SHA-256 checksums
        run: |
          mkdir -p release-assets
          cp artifacts/wyrdstone-windows-x64/*.exe release-assets/
          cp artifacts/wyrdstone-android-arm64/*.apk release-assets/
          (cd release-assets && sha256sum *.exe *.apk > SHA256SUMS.txt)
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.apk
            release-assets/SHA256SUMS.txt
