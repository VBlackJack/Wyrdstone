version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      cargo-dependencies:
        patterns:
          - "*"
    ignore:
      # Pinned to 0.15.2: Bevy 0.15.3 freezes Windows resizes (#17488/#18065).
      - dependency-name: "bevy"
      - dependency-name: "bevy_winit"
      # Bevy 0.15 uses rand 0.8; 0.9+ has breaking API changes.
      - dependency-name: "rand"
        versions:
          - ">= 0.9.0"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
